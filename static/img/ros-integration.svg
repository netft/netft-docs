<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">ROS Net F/T integration paths</title>
  <desc id="desc">The private protocol core feeds either a standalone ROS node or a ros2_control hardware plugin.</desc>
  <rect width="1000" height="360" rx="24" fill="#f6f6f4"/>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="50" y="105" width="190" height="130" rx="16"/>
    <rect x="310" y="105" width="190" height="130" rx="16"/>
    <rect x="570" y="45" width="360" height="110" rx="16"/>
    <rect x="570" y="205" width="360" height="110" rx="16"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" fill="#111">
    <text x="145" y="160" font-size="23" font-weight="600">ATI Net F/T</text>
    <text x="145" y="192" font-size="16" fill="#555">HTTP + RDT</text>
    <text x="405" y="150" font-size="23" font-weight="600">Private core</text>
    <text x="405" y="182" font-size="16" fill="#555">calibration · health · recovery</text>

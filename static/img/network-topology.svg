<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Net F/T network topology</title>
  <desc id="desc">A client connects through a trusted Ethernet network to the NetBox and transducer. HTTP carries configuration and UDP carries RDT samples.</desc>
  <rect width="1200" height="320" rx="24" fill="#f6f6f4"/>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="45" y="85" width="270" height="150" rx="18"/>
    <rect x="465" y="85" width="270" height="150" rx="18"/>
    <rect x="885" y="85" width="270" height="150" rx="18"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" fill="#111">
    <text x="180" y="150" font-size="25" font-weight="600">Client</text>
    <text x="180" y="186" font-size="17" fill="#555">CLI · Viewer · SDK · ROS</text>
    <text x="600" y="150" font-size="25" font-weight="600">Trusted Ethernet</text>
    <text x="600" y="186" font-size="17" fill="#555">Addressing · routing · firewall</text>
    <text x="1020" y="150" font-size="25" font-weight="600">NetBox + transducer</text>
    <text x="1020" y="186" font-size="17" fill="#555">Configuration · six-axis data</text>
  </g>
  <g stroke-width="4" fill="none">
    <path d="M315 135H465" stroke="#777"/>
    <path d="M735 135H885" stroke="#777"/>
    <path d="M885 188H735M465 188H315" stroke="#111"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" font-size="13" fill="#555">
    <text x="390" y="122">HTTP configuration →</text>
    <text x="810" y="122">HTTP configuration →</text>
    <text x="810" y="215">← RDT / UDP</text>
    <text x="390" y="215">← RDT / UDP</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Net F/T network topology</title>
  <desc id="desc">A client connects through a trusted Ethernet network to the NetBox and transducer. HTTP carries configuration and UDP carries RDT samples.</desc>
  <rect width="1000" height="300" rx="24" fill="#f6f6f4"/>
  <g fill="#fff" stroke="#111" stroke-width="2">
    <rect x="50" y="75" width="220" height="150" rx="18"/>
    <rect x="390" y="75" width="220" height="150" rx="18"/>
    <rect x="730" y="75" width="220" height="150" rx="18"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" fill="#111">
    <text x="160" y="140" font-size="25" font-weight="600">Client</text>
    <text x="160" y="176" font-size="17" fill="#555">CLI · Viewer · SDK · ROS</text>
    <text x="500" y="140" font-size="25" font-weight="600">Trusted Ethernet</text>
    <text x="500" y="176" font-size="17" fill="#555">Addressing · routing · firewall</text>
    <text x="840" y="140" font-size="25" font-weight="600">NetBox + transducer</text>
    <text x="840" y="176" font-size="17" fill="#555">Configuration · six-axis data</text>
  </g>
  <g stroke-width="4" fill="none">
    <path d="M270 125H390" stroke="#777"/>
    <path d="M610 125H730" stroke="#777"/>
    <path d="M730 178H610M390 178H270" stroke="#111"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" font-size="14" fill="#555">
    <text x="330" y="112">HTTP configuration →</text>
    <text x="670" y="112">HTTP configuration →</text>
    <text x="670" y="205">← RDT / UDP</text>
    <text x="330" y="205">← RDT / UDP</text>
  </g>
</svg>
